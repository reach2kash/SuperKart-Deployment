services:
  backend:
    build: ./backend_files
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend_files
    ports:
      - "8501:8501"
    depends_on:
      - backend
